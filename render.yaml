services:
  - type: web
    name: nexcampus-backend
    env: node
    buildCommand: cd server && npm install && npm run build
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: nexcampus-db
          property: connectionString

databases:
  - name: nexcampus-db
    databaseName: nexcampus
    user: postgres
